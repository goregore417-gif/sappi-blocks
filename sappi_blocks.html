<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>SAPPI BLOCKS</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#10131a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;min-height:100vh}.app{width:min(100vw,430px);padding:10px;text-align:center}h1{font-size:22px;margin:4px}.top{display:flex;justify-content:space-around;margin:6px;font-weight:700}canvas{background:#07090d;border:2px solid #394050;width:min(92vw,360px);height:auto}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px auto;max-width:380px}.controls button{font-size:26px;height:58px;border:0;border-radius:14px;background:#2b3342;color:white;box-shadow:0 3px 0 #171c25}.controls button:active{transform:translateY(2px);box-shadow:0 1px 0 #171c25}.wide{grid-column:span 2;font-size:18px!important}.msg{height:24px;color:#ffd166}</style></head><body><div class='app'><h1>SAPPI BLOCKS</h1><div class='top'><span>Score <b id='score'>0</b></span><span>Lines <b id='lines'>0</b></span><span>Level <b id='level'>1</b></span></div><canvas id='game' width='300' height='600'></canvas><div class='msg' id='msg'></div><div class='controls'><button id='left'>◀</button><button id='rot'>↻</button><button id='right'>▶</button><button id='down'>▼</button><button class='wide' id='drop'>一気に落とす</button><button class='wide' id='new'>NEW GAME</button></div></div><script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),W=10,H=20,S=30;
const colors=['#000','#4dd0e1','#ffd54f','#ba68c8','#66bb6a','#ef5350','#42a5f5','#ffa726'];
const shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let board,piece,score,lines,level,last=0,over=false;
function reset(){board=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;level=1;over=false;spawn();ui();document.getElementById('msg').textContent='';}
function spawn(){let n=Math.floor(Math.random()*7);piece={m:shapes[n].map(r=>r.slice()),x:Math.floor((W-shapes[n][0].length)/2),y:0};if(collide(piece.x,piece.y,piece.m)){over=true;document.getElementById('msg').textContent='GAME OVER';}}
function collide(x,y,m){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]&&(x+c<0||x+c>=W||y+r>=H||(y+r>=0&&board[y+r][x+c])))return true;return false;}
function merge(){piece.m.forEach((r,yy)=>r.forEach((v,xx)=>{if(v&&piece.y+yy>=0)board[piece.y+yy][piece.x+xx]=v}));clearLines();spawn();}
function clearLines(){let n=0;for(let y=H-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(W).fill(0));n++;y++;}}if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+Math.floor(lines/10);ui();}}
function move(dx,dy){if(over)return;if(!collide(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;return true}if(dy){merge();ui()}return false;}
function rotate(){if(over)return;let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(const k of [0,-1,1,-2,2])if(!collide(piece.x+k,piece.y,m)){piece.x+=k;piece.m=m;break}}
function hard(){if(over)return;let d=0;while(!collide(piece.x,piece.y+1,piece.m)){piece.y++;d++}score+=d*2;merge();ui();}
function ui(){scoreEl.textContent=score;linesEl.textContent=lines;levelEl.textContent=level}const scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),levelEl=document.getElementById('level');
function drawCell(x,y,v){ctx.fillStyle=colors[v];ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x*S+3,y*S+3,S-6,4)}
function draw(){ctx.fillStyle='#07090d';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.strokeStyle='#171c25';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke()}board.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(x,y,v)));if(piece&&!over)piece.m.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(piece.x+x,piece.y+y,v)));}
function loop(t=0){if(!over&&t-last>Math.max(120,800-(level-1)*60)){move(0,1);last=t}draw();requestAnimationFrame(loop)}
left.onclick=()=>move(-1,0);right.onclick=()=>move(1,0);down.onclick=()=>{if(move(0,1)){score++;ui()}};rot.onclick=rotate;drop.onclick=hard;new.onclick=reset;
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowUp')rotate();if(e.code==='Space')hard()});
let sx,sy;cvs.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});cvs.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<25&&Math.abs(dy)<25)rotate();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else if(dy>30)hard()},{passive:true});
reset();loop();
</script></body></html>
