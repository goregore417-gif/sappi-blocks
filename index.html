<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAPPI BLOCKS v0.5.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}.app{width:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;justify-items:center;align-items:center;padding:max(5px,env(safe-area-inset-top)) 7px max(6px,env(safe-area-inset-bottom));gap:4px}
.top{width:min(98vw,445px);display:flex;align-items:center;justify-content:space-between}.title{font-size:clamp(13px,3.7vw,18px);font-weight:900}.stats{display:flex;gap:6px;font-size:9px;white-space:nowrap}
.gameRow{height:100%;min-height:0;display:flex;gap:5px;align-items:flex-start;justify-content:center}
#game{display:block;background:#050b15;border:2px solid #33435d;border-radius:8px;width:auto;height:min(100%,calc((100vw - 105px)*2));max-width:calc(100vw - 105px);aspect-ratio:1/2;box-shadow:0 6px 24px #0008;touch-action:none}
.side{width:83px;display:flex;flex-direction:column;gap:4px}.panel{background:#111b2d;border:1px solid #33435d;border-radius:8px;padding:4px;text-align:center;font-size:9px;font-weight:900}.preview{display:block;width:62px;height:62px;margin:auto}.small{height:28px;border:0;border-radius:8px;font-size:9px;font-weight:900;background:#e8edf7;color:#111}
#msg{height:17px;font-size:11px;font-weight:900;text-align:center}
.controls{width:min(98vw,435px);display:grid;grid-template-columns:1fr .72fr;gap:13px;align-items:center;transform:translateY(-18px);margin-bottom:-18px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.controls>.pad:first-child{transform:translateY(-12px)}.actionPad{grid-template-columns:1fr;grid-template-rows:repeat(3,54px);width:96px;gap:11px;justify-self:end;transform:translateY(-72px)}.ctrl{height:47px;border:0;border-radius:11px;font-size:19px;font-weight:900;background:#e9eef7;color:#101827;box-shadow:0 3px 0 #7f8ca3;touch-action:none}.action{height:54px;display:flex;align-items:center;justify-content:center;gap:6px}.action span{font-size:21px}.action small{font-size:10px;font-weight:900}.holdBtn{background:#ffe59a}.rotateBtn{background:#aee9ff}.dropBtn{background:#ffb4a9}.ctrl:active,.ctrl.held{transform:translateY(2px);box-shadow:0 1px 0 #7f8ca3;background:#ccd7e7}.hint{font-size:8px;opacity:.55;white-space:nowrap}
.impact{animation:impact .13s ease-out}.flash{animation:flash .14s 2}
@keyframes impact{0%{transform:translateY(0)}35%{transform:translateY(4px) scaleY(.992)}100%{transform:translateY(0)}}@keyframes flash{50%{filter:brightness(2)}}
@media(max-width:390px){.side{width:75px}#game{max-width:calc(100vw - 95px);height:min(100%,calc((100vw - 95px)*2))}.preview{width:55px;height:55px}.controls{gap:9px}.ctrl{height:46px}.actionPad{width:92px;grid-template-rows:repeat(3,52px);gap:10px;transform:translateY(-68px)}.action{height:52px}.hint{font-size:7px}}
</style></head>
<body><div class="app">
<div class="top"><div class="title">SAPPI BLOCKS <small>v0.5.2 TESTED</small></div>
<div class="stats"><span>S <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>LV <b id="level">1</b></span><span>L <b id="lines">0</b></span></div></div>
<div class="gameRow">
<canvas id="game" width="300" height="600"></canvas>
<div class="side">
<div class="panel">NEXT<canvas class="preview" id="next" width="72" height="72"></canvas></div>
<div class="panel">HOLD<canvas class="preview" id="holdPreview" width="72" height="72"></canvas></div>
<button class="small" id="pause">⏸ PAUSE</button><button class="small" id="sound">🔊 SOUND</button><button class="small" id="music">♫ BGM</button><button class="small" id="new">NEW</button>
</div></div>
<div id="msg"></div>
<div class="controls">
<div class="pad"><button class="ctrl" id="left">←</button><button class="ctrl" id="down">↓</button><button class="ctrl" id="right">→</button></div>
<div class="pad actionPad"><button class="ctrl action holdBtn" id="hold"><span>▣</span><small>HOLD</small></button><button class="ctrl action rotateBtn" id="rotate"><span>↻</span><small>回転</small></button><button class="ctrl action dropBtn" id="drop"><span>⇊</span><small>落下</small></button></div>
</div>
<div class="hint">左手＝移動 ／ 右手＝回転・HOLD・一気落とし</div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("game"),ctx=cv.getContext("2d"),nc=$("next"),nx=nc.getContext("2d"),hc=$("holdPreview"),hx=hc.getContext("2d");
const W=10,H=20,S=30,LOCK_DELAY=470;
const colors=["","#38d7ed","#ffe04c","#c86bff","#5ce27c","#ff6068","#5898ff","#ff9e46"];
const shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let board,piece,nextId,holdId=null,holdUsed=false,score=0,lines=0,level=1,combo=-1,maxCombo=0,over=false,paused=false;
let lastFall=0,groundedAt=null,visualY=0,lastFrame=0,lockFlash=null,lockFlashUntil=0;
let best=+(localStorage.getItem("sappiBest")||0),soundOn=true,musicOn=false,audio,bgmTimer=null;
const rand=()=>Math.floor(Math.random()*7),clone=id=>shapes[id].map(r=>r.slice());
const gravityMs=()=>Math.max(105,780-(level-1)*55);
const rank=()=>level>=10?"SAPPI":level>=7?"MASTER":level>=5?"BUILDER":level>=3?"BLOCKER":"ROOKIE";

function makePiece(id){return{id,m:clone(id),x:Math.floor((W-shapes[id][0].length)/2),y:0}}
function hit(x,y,m){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){let X=x+c,Y=y+r;if(X<0||X>=W||Y>=H||(Y>=0&&board[Y][X]))return true}return false}
function spawn(id=null){let use=id??nextId;if(id===null)nextId=rand();piece=makePiece(use);holdUsed=false;groundedAt=null;visualY=piece.y;if(hit(piece.x,piece.y,piece.m)){over=true;saveBest();$("msg").textContent="GAME OVER • "+rank()}drawPreviews();ui()}
function reset(){board=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;level=1;combo=-1;maxCombo=0;over=paused=false;holdId=null;holdUsed=false;nextId=rand();lastFall=performance.now();spawn();$("msg").textContent="ROOKIE";ui()}
function saveBest(){if(score>best){best=score;localStorage.setItem("sappiBest",best)}}
function ui(){$("score").textContent=score;$("best").textContent=Math.max(best,score);$("level").textContent=level;$("lines").textContent=lines;$("pause").textContent=paused?"▶ RESUME":"⏸ PAUSE";$("sound").textContent=soundOn?"🔊 SOUND":"🔇 SOUND";$("music").textContent=musicOn?"♫ BGM ON":"♫ BGM"}

function tone(freq=440,d=.05,type="sine",vol=.04){if(!soundOn)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function lineSound(n){tone([0,520,620,760,980][n]||520,.11,n===4?"square":"sine",.055)}
function toggleMusic(){musicOn=!musicOn;clearInterval(bgmTimer);if(musicOn)bgmTimer=setInterval(()=>{if(!paused&&!over){let base=level>=10?520:level>=5?440:330;tone(base,.045,"triangle",.018)}},460);ui()}

function rotateMatrix(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function move(dx,dy){if(over||paused)return false;if(!hit(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;if(dy){visualY=Math.min(visualY,piece.y)}refreshGround();return true}if(dy>0&&groundedAt===null)groundedAt=performance.now();return false}
function rotate(){if(over||paused)return;let m=rotateMatrix(piece.m);for(let k of [0,-1,1,-2,2])if(!hit(piece.x+k,piece.y,m)){piece.x+=k;piece.m=m;refreshGround();tone(470,.025);return}}
function refreshGround(){if(hit(piece.x,piece.y+1,piece.m))groundedAt=performance.now();else groundedAt=null}
function hardDrop(){if(over||paused)return;let n=0;while(!hit(piece.x,piece.y+1,piece.m)){piece.y++;n++}score+=n*2;visualY=piece.y;groundedAt=performance.now();cv.classList.remove("impact");void cv.offsetWidth;cv.classList.add("impact");tone(125,.07,"square",.05);ui()}
function doHold(){if(over||paused||holdUsed)return;let old=piece.id;if(holdId===null){holdId=old;spawn()}else{let swap=holdId;holdId=old;piece=makePiece(swap);groundedAt=null;visualY=piece.y;if(hit(piece.x,piece.y,piece.m)){over=true;saveBest()}}holdUsed=true;drawPreviews();tone(300,.05,"triangle");ui()}

function merge(){
 let cells=[];
 for(let r=0;r<piece.m.length;r++)for(let c=0;c<piece.m[r].length;c++)if(piece.m[r][c]){let y=piece.y+r,x=piece.x+c;if(y>=0){board[y][x]=piece.m[r][c];cells.push([x,y])}}
 lockFlash=cells;lockFlashUntil=performance.now()+120;groundedAt=null;tone(235,.045,"square",.035);clearLines();
}
function clearLines(){
 let rows=[];for(let y=0;y<H;y++)if(board[y].every(Boolean))rows.push(y);
 if(!rows.length){combo=-1;spawn();return}
 const n=rows.length,kept=board.filter((_,y)=>!rows.includes(y));board=[...Array.from({length:n},()=>Array(W).fill(0)),...kept];
 combo++;maxCombo=Math.max(maxCombo,combo);score+=[0,100,320,560,900][n]*level+(combo>0?combo*50*level:0);lines+=n;level=1+Math.floor(lines/10);saveBest();
 lineSound(n);$("msg").textContent=(["","SINGLE!","DOUBLE!!","TRIPLE!!!","QUAD!!!!"][n]||"CLEAR!")+(combo>0?"  COMBO ×"+(combo+1):"");
 cv.classList.remove("flash");void cv.offsetWidth;cv.classList.add("flash");spawn();ui()
}

function ghostY(){let y=piece.y;while(!hit(piece.x,y+1,piece.m))y++;return y}
function block(g,x,y,val,a=1){g.globalAlpha=a;g.fillStyle=colors[val];g.fillRect(x*S+1,y*S+1,S-2,S-2);g.fillStyle="rgba(255,255,255,.16)";g.fillRect(x*S+3,y*S+3,S-6,4);g.globalAlpha=1}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle="rgba(255,255,255,.035)";ctx.lineWidth=1;
 for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke()}for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke()}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(board[y][x])block(ctx,x,y,board[y][x]);
 if(!over&&piece){let gy=ghostY();for(let r=0;r<piece.m.length;r++)for(let c=0;c<piece.m[r].length;c++)if(piece.m[r][c])block(ctx,piece.x+c,gy+r,piece.m[r][c],.18);
   for(let r=0;r<piece.m.length;r++)for(let c=0;c<piece.m[r].length;c++)if(piece.m[r][c])block(ctx,piece.x+c,visualY+r,piece.m[r][c],1)}
 if(lockFlash&&performance.now()<lockFlashUntil){ctx.fillStyle="rgba(255,255,255,.48)";for(const [x,y] of lockFlash)ctx.fillRect(x*S+2,y*S+2,S-4,S-4)}
 if(paused){ctx.fillStyle="#0009";ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle="#fff";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("PAUSE",150,300)}
}
function preview(g,id){g.clearRect(0,0,72,72);if(id===null||id===undefined)return;let m=shapes[id],sz=15,ox=(72-m[0].length*sz)/2,oy=(72-m.length*sz)/2;for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){g.fillStyle=colors[m[r][c]];g.fillRect(ox+c*sz+1,oy+r*sz+1,sz-2,sz-2)}}
function drawPreviews(){preview(nx,nextId);preview(hx,holdId)}
function loop(t=0){
 let dt=Math.min(40,t-lastFrame||16);lastFrame=t;
 if(!over&&!paused){
   let target=piece.y;visualY+=Math.min(target-visualY,dt/gravityMs()*1.35);if(Math.abs(target-visualY)<.01)visualY=target;
   if(groundedAt!==null&&t-groundedAt>=LOCK_DELAY){merge();lastFall=t}
   else if(t-lastFall>=gravityMs()){move(0,1);lastFall=t}
 }
 draw();requestAnimationFrame(loop)
}
function togglePause(){if(over)return;paused=!paused;if(!paused){lastFall=performance.now();if(groundedAt!==null)groundedAt=performance.now()}$("msg").textContent=paused?"PAUSE":rank();ui();tone(paused?180:520,.06)}

function repeatButton(id,fn,repeat=true){
 const b=$(id);let timer=null,interval=null;
 const stop=()=>{clearTimeout(timer);clearInterval(interval);timer=interval=null;b.classList.remove("held")};
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);b.classList.add("held");fn();if(repeat)timer=setTimeout(()=>interval=setInterval(fn,70),180)});
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,stop));
}
repeatButton("left",()=>move(-1,0));repeatButton("right",()=>move(1,0));repeatButton("down",()=>{if(move(0,1)){score++;ui()}});
repeatButton("rotate",rotate,false);repeatButton("hold",doHold,false);repeatButton("drop",hardDrop,false);
$("pause").onclick=togglePause;$("sound").onclick=()=>{soundOn=!soundOn;ui()};$("music").onclick=toggleMusic;$("new").onclick=reset;


// 盤面タッチ操作：タップ=回転、左右ドラッグ=追従、下スワイプ=一気落とし
let boardPointer=null;
cv.addEventListener("pointerdown",e=>{
 if(over||paused)return;
 e.preventDefault(); cv.setPointerCapture?.(e.pointerId);
 boardPointer={id:e.pointerId,sx:e.clientX,sy:e.clientY,lastX:e.clientX,moved:false};
});
cv.addEventListener("pointermove",e=>{
 if(!boardPointer||boardPointer.id!==e.pointerId||over||paused)return;
 e.preventDefault();
 const step=Math.max(18,cv.getBoundingClientRect().width/W*.82);
 let dx=e.clientX-boardPointer.lastX;
 while(Math.abs(dx)>=step){
   move(dx>0?1:-1,0); boardPointer.lastX+=dx>0?step:-step; dx=e.clientX-boardPointer.lastX; boardPointer.moved=true;
 }
 if(Math.abs(e.clientY-boardPointer.sy)>18)boardPointer.moved=true;
});
function finishBoardPointer(e){
 if(!boardPointer||boardPointer.id!==e.pointerId)return;
 e.preventDefault();
 const dx=e.clientX-boardPointer.sx,dy=e.clientY-boardPointer.sy;
 if(dy>55&&Math.abs(dy)>Math.abs(dx)*1.15)hardDrop();
 else if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();
 boardPointer=null;
}
cv.addEventListener("pointerup",finishBoardPointer);
cv.addEventListener("pointercancel",()=>boardPointer=null);

document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1,0);else if(e.key==="ArrowRight")move(1,0);else if(e.key==="ArrowDown")move(0,1);else if(e.key==="ArrowUp")rotate();else if(e.code==="Space")hardDrop();else if(e.key.toLowerCase()==="c")doHold();else if(e.key.toLowerCase()==="p")togglePause()});
["gesturestart","gesturechange","gestureend","contextmenu","selectstart","dragstart"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
reset();requestAnimationFrame(loop);
</script></body></html>
