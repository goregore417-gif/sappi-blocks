<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SAPPI BLOCKS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:white;font-family:system-ui;touch-action:manipulation}.w{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}h1{font-size:21px;margin:0}.s{display:flex;gap:15px;font-weight:700}canvas{background:#07101d;border:2px solid #34435d;border-radius:8px;max-height:62vh;width:auto;max-width:92vw}.c{display:grid;grid-template-columns:repeat(3,72px);gap:8px}button{height:52px;border:0;border-radius:12px;font-size:23px;font-weight:800}.m{height:22px;font-weight:800}</style></head>
<body><div class="w"><h1>SAPPI BLOCKS</h1><div class="s"><span>Score <b id="sc">0</b></span><span>Lines <b id="li">0</b></span><span>Lv <b id="lv">1</b></span></div><canvas id="g" width="300" height="600"></canvas><div id="msg" class="m"></div><div class="c"><button id="l">←</button><button id="r">↻</button><button id="rr">→</button><button id="d">↓</button><button id="hd">⤓</button><button id="nw">NEW</button></div></div>
<script>
"use strict";
const cv=document.getElementById("g"),cx=cv.getContext("2d"),W=10,H=20,S=30,C=["","#4dd0e1","#ffd54f","#ba68c8","#66bb6a","#ef5350","#42a5f5","#ffa726"],P=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let b,p,score,lines,level,last=0,over=false;
function reset(){b=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;level=1;over=false;last=0;spawn();ui();msg.textContent=""}
function spawn(){let n=Math.floor(Math.random()*7);p={m:P[n].map(x=>x.slice()),x:Math.floor((W-P[n][0].length)/2),y:0};if(hit(p.x,p.y,p.m)){over=true;msg.textContent="GAME OVER"}}
function hit(x,y,m){for(let j=0;j<m.length;j++)for(let i=0;i<m[j].length;i++)if(m[j][i]&&(x+i<0||x+i>=W||y+j>=H||(y+j>=0&&b[y+j][x+i])))return true;return false}
function merge(){p.m.forEach((row,j)=>row.forEach((v,i)=>{if(v&&p.y+j>=0)b[p.y+j][p.x+i]=v}));clear();spawn()}
function clear(){let n=0;for(let y=H-1;y>=0;y--)if(b[y].every(Boolean)){b.splice(y,1);b.unshift(Array(W).fill(0));n++;y++}if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+Math.floor(lines/10)}}
function move(dx,dy){if(over)return false;if(!hit(p.x+dx,p.y+dy,p.m)){p.x+=dx;p.y+=dy;return true}if(dy){merge();ui()}return false}
function rot(){if(over)return;let m=p.m[0].map((_,i)=>p.m.map(x=>x[i]).reverse());for(let k of [0,-1,1,-2,2])if(!hit(p.x+k,p.y,m)){p.x+=k;p.m=m;break}}
function hard(){if(over)return;let n=0;while(!hit(p.x,p.y+1,p.m)){p.y++;n++}score+=n*2;merge();ui()}
function ui(){sc.textContent=score;li.textContent=lines;lv.textContent=level}
function cell(x,y,v){cx.fillStyle=C[v];cx.fillRect(x*S+1,y*S+1,S-2,S-2)}
function draw(){cx.fillStyle="#07101d";cx.fillRect(0,0,300,600);cx.strokeStyle="#17243b";for(let x=0;x<=W;x++){cx.beginPath();cx.moveTo(x*S,0);cx.lineTo(x*S,600);cx.stroke()}for(let y=0;y<=H;y++){cx.beginPath();cx.moveTo(0,y*S);cx.lineTo(300,y*S);cx.stroke()}b.forEach((row,y)=>row.forEach((v,x)=>v&&cell(x,y,v)));p&&p.m.forEach((row,j)=>row.forEach((v,i)=>v&&p.y+j>=0&&cell(p.x+i,p.y+j,v)))}
function loop(t=0){if(!over&&t-last>Math.max(120,800-(level-1)*60)){move(0,1);last=t}draw();requestAnimationFrame(loop)}
l.onclick=()=>move(-1,0);rr.onclick=()=>move(1,0);d.onclick=()=>{if(move(0,1)){score++;ui()}};r.onclick=rot;hd.onclick=hard;nw.onclick=reset;
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1,0);else if(e.key==="ArrowRight")move(1,0);else if(e.key==="ArrowDown")move(0,1);else if(e.key==="ArrowUp")rot();else if(e.code==="Space"){e.preventDefault();hard()}});
let sx=0,sy=0;cv.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});cv.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20)rot();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else if(dy>40)hard()},{passive:true});
reset();requestAnimationFrame(loop);
</script></body></html>
