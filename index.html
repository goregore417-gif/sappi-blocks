<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>SAPPI BLOCKS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
.app{width:100%;height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;align-items:center;justify-items:center;padding:max(5px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));gap:5px;overflow:hidden;touch-action:none}
.top{width:min(96vw,430px);display:flex;align-items:center;justify-content:space-between;min-height:28px}.title{font-size:clamp(14px,4vw,19px);font-weight:900;letter-spacing:.06em;white-space:nowrap}.stats{font-size:10px;display:flex;gap:7px;white-space:nowrap}
.gameRow{height:100%;max-height:100%;display:flex;gap:6px;align-items:flex-start;justify-content:center;min-height:0}
#game{display:block;background:#050b15;border:2px solid #33435d;border-radius:8px;width:auto;height:min(100%,calc((100vw - 104px)*2));max-width:calc(100vw - 104px);aspect-ratio:1/2;box-shadow:0 6px 24px #0008;touch-action:none}
.side{width:82px;display:flex;flex-direction:column;gap:5px}.panel{background:#111b2d;border:1px solid #33435d;border-radius:8px;padding:5px;text-align:center;font-size:10px;font-weight:800}
#next{width:68px;height:68px;touch-action:none}.small{width:100%;height:34px;border:0;border-radius:8px;font-size:10px;font-weight:800;background:#e8edf7;color:#111;touch-action:none}
#msg{height:16px;font-size:12px;font-weight:900;text-align:center}.controls{display:grid;grid-template-columns:repeat(6,minmax(45px,62px));gap:5px;width:min(98vw,397px);justify-content:center}
.ctrl{height:46px;border:0;border-radius:11px;font-size:20px;font-weight:900;background:#e9eef7;color:#101827;box-shadow:0 3px 0 #7f8ca3;touch-action:none}
.ctrl:active,.held{transform:translateY(2px);box-shadow:0 1px 0 #7f8ca3;background:#cfd8e7}.hint{font-size:9px;opacity:.6;text-align:center;max-width:430px;white-space:nowrap}
.flash{animation:flash .16s 2}@keyframes flash{50%{filter:brightness(2)}}
@media (max-width:390px){.side{width:74px}#game{max-width:calc(100vw - 94px);height:min(100%,calc((100vw - 94px)*2))}#next{width:60px;height:60px}.controls{grid-template-columns:repeat(6,minmax(42px,56px))}.ctrl{height:43px}.hint{font-size:8px}}
</style></head>
<body><div class="app">
<div class="top"><div class="title">SAPPI BLOCKS <small>v0.4</small></div><div class="stats"><span>SCORE <b id="score">0</b></span><span>LINES <b id="lines">0</b></span><span>LV <b id="level">1</b></span></div></div>
<div class="gameRow"><canvas id="game" width="300" height="600"></canvas><div class="side">
<div class="panel">NEXT<canvas id="next" width="72" height="72"></canvas></div>
<button class="small" id="pause">⏸ PAUSE</button><button class="small" id="sound">🔊 SOUND</button><button class="small" id="music">♫ BGM</button><button class="small" id="new">NEW</button>
</div></div><div id="msg"></div>
<div class="controls"><button class="ctrl" id="left">←</button><button class="ctrl" id="rotate">↻</button><button class="ctrl" id="right">→</button><button class="ctrl" id="down">↓</button><button class="ctrl" id="drop">⤓</button><button class="ctrl" id="pause2">⏸</button></div>
<div class="hint">タップ＝回転 ／ 指の左右移動に追従 ／ 下スワイプ＝一気落とし ／ 着地後も一瞬だけ操作可能</div>
</div>
<script>
"use strict";
const cv=document.querySelector("#game"),ctx=cv.getContext("2d"),nc=document.querySelector("#next"),nx=nc.getContext("2d");
const W=10,H=20,S=30,LOCK_DELAY=470;
const colors=["","#39d8ee","#ffe04d","#c66bff","#5be27c","#ff5e66","#5595ff","#ff9e45"];
const shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let board,piece,nextId,score,lines,level,over,paused,last=0,groundedAt=null,clearing=[],clearUntil=0;
let soundOn=true,musicOn=false,audio=null,bgmTimer=null;
const $=id=>document.getElementById(id), rand=()=>Math.floor(Math.random()*shapes.length), clone=id=>shapes[id].map(r=>r.slice());

function reset(){board=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;level=1;over=paused=false;last=0;groundedAt=null;clearing=[];nextId=rand();spawn();ui();$("msg").textContent="";drawNext()}
function spawn(){let id=nextId;nextId=rand();piece={m:clone(id),x:Math.floor((W-shapes[id][0].length)/2),y:0};groundedAt=null;drawNext();if(hit(piece.x,piece.y,piece.m)){over=true;$("msg").textContent="GAME OVER";tone(90,.35,"sawtooth")}}
function hit(x,y,m){for(let j=0;j<m.length;j++)for(let i=0;i<m[j].length;i++)if(m[j][i]&&(x+i<0||x+i>=W||y+j>=H||(y+j>=0&&board[y+j][x+i])))return true;return false}
function onGround(){return hit(piece.x,piece.y+1,piece.m)}
function refreshLock(){groundedAt=onGround()?performance.now():null}
function merge(){piece.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&piece.y+j>=0)board[piece.y+j][piece.x+i]=v}));groundedAt=null;findLines()}
function findLines(){let rows=[];for(let y=0;y<H;y++)if(board[y].every(Boolean))rows.push(y);if(!rows.length){spawn();return}clearing=rows;clearUntil=performance.now()+220;lineSound(rows.length);$("msg").textContent=["","SINGLE!","DOUBLE!!","TRIPLE!!!","QUAD!!!!"][rows.length]||"CLEAR!";cv.classList.remove("flash");void cv.offsetWidth;cv.classList.add("flash")}
function finishClear(){let n=clearing.length;[...clearing].sort((a,b)=>b-a).forEach(y=>{board.splice(y,1);board.unshift(Array(W).fill(0))});lines+=n;score+=[0,100,320,560,900][n]*level;level=1+Math.floor(lines/10);clearing=[];ui();spawn()}
function move(dx,dy){if(over||paused||clearing.length)return false;if(!hit(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;if(dx){tone(230,.025);refreshLock()}else groundedAt=null;return true}if(dy&&groundedAt===null)groundedAt=performance.now();return false}
function rotate(){if(over||paused||clearing.length)return;let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(let k of [0,-1,1,-2,2])if(!hit(piece.x+k,piece.y,m)){piece.x+=k;piece.m=m;tone(420,.04);refreshLock();break}}
function hard(){if(over||paused||clearing.length)return;let n=0;while(!hit(piece.x,piece.y+1,piece.m)){piece.y++;n++}score+=n*2;tone(130,.07,"square");merge();ui()}
function ghostY(){let y=piece.y;while(!hit(piece.x,y+1,piece.m))y++;return y}
function ui(){$("score").textContent=score;$("lines").textContent=lines;$("level").textContent=level;$("pause").textContent=paused?"▶ RESUME":"⏸ PAUSE"}
function cell(c,x,y,v,a=1){c.globalAlpha=a;c.fillStyle=colors[v];c.fillRect(x*S+1,y*S+1,S-2,S-2);c.globalAlpha=1}
function draw(){ctx.fillStyle="#050b15";ctx.fillRect(0,0,300,600);ctx.strokeStyle="#142137";for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}
board.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(ctx,x,y,v,clearing.includes(y)?0.3:1)}));
if(piece&&!over){let gy=ghostY();piece.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&gy+j>=0)cell(ctx,piece.x+i,gy+j,v,.18)}));piece.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&piece.y+j>=0)cell(ctx,piece.x+i,piece.y+j,v)}))}
if(paused){ctx.fillStyle="#000b";ctx.fillRect(0,0,300,600);ctx.fillStyle="#fff";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("PAUSED",150,300)}}
function drawNext(){nx.fillStyle="#0a1220";nx.fillRect(0,0,72,72);let m=shapes[nextId],bs=15,ox=(72-m[0].length*bs)/2,oy=(72-m.length*bs)/2;m.forEach((r,j)=>r.forEach((v,i)=>{if(v){nx.fillStyle=colors[v];nx.fillRect(ox+i*bs+1,oy+j*bs+1,bs-2,bs-2)}}))}
function loop(t=0){if(clearing.length&&t>=clearUntil)finishClear();if(!over&&!paused&&!clearing.length){if(groundedAt!==null&&t-groundedAt>=LOCK_DELAY){merge();ui();last=t}else if(t-last>Math.max(110,780-(level-1)*55)){move(0,1);last=t}}draw();requestAnimationFrame(loop)}

function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();return audio}
function tone(freq,d=.05,type="sine",vol=.035,delay=0){if(!soundOn)return;let a=ac(),o=a.createOscillator(),g=a.createGain(),now=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+d)}
function lineSound(n){for(let i=0;i<n;i++)tone(420+i*150,.12,i==3?"sawtooth":"square",.045,i*.055);if(n===4)tone(1100,.25,"sawtooth",.06,.23)}
function togglePause(){if(over)return;paused=!paused;if(!paused&&groundedAt!==null)groundedAt=performance.now();ui();$("msg").textContent=paused?"PAUSE":"";tone(paused?180:520,.08)}
function startBgm(){stopBgm();if(!musicOn)return;let notes=[262,330,392,330,294,349,440,349],i=0;bgmTimer=setInterval(()=>{if(!paused&&!over)tone(notes[i++%notes.length],.12,"triangle",.018)},220)}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}

$("rotate").onclick=rotate;$("drop").onclick=hard;$("new").onclick=reset;$("pause").onclick=togglePause;$("pause2").onclick=togglePause;
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 SOUND":"🔇 SOUND"};
$("music").onclick=()=>{musicOn=!musicOn;$("music").textContent=musicOn?"♫ BGM ON":"♫ BGM";musicOn?startBgm():stopBgm()};
function holdButton(id,fn){let timer=null,repeat=null,el=$(id);const start=e=>{e.preventDefault();fn();el.classList.add("held");timer=setTimeout(()=>{repeat=setInterval(fn,65)},190)};const end=e=>{if(e)e.preventDefault();clearTimeout(timer);clearInterval(repeat);timer=repeat=null;el.classList.remove("held")};el.addEventListener("pointerdown",start);["pointerup","pointercancel","pointerleave"].forEach(x=>el.addEventListener(x,end))}
holdButton("left",()=>move(-1,0));holdButton("right",()=>move(1,0));holdButton("down",()=>{if(move(0,1)){score++;ui()}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1,0);else if(e.key==="ArrowRight")move(1,0);else if(e.key==="ArrowDown")move(0,1);else if(e.key==="ArrowUp")rotate();else if(e.code==="Space"){e.preventDefault();hard()}else if(e.key.toLowerCase()==="p")togglePause()});

let sx=0,sy=0,lastX=0,moved=false,dragging=false;
cv.addEventListener("pointerdown",e=>{e.preventDefault();sx=lastX=e.clientX;sy=e.clientY;moved=false;dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",e=>{if(!dragging)return;e.preventDefault();let dx=e.clientX-lastX,dy=e.clientY-sy;if(Math.abs(e.clientX-sx)>10||Math.abs(dy)>10)moved=true;const step=25;while(dx>=step){move(1,0);lastX+=step;dx=e.clientX-lastX}while(dx<=-step){move(-1,0);lastX-=step;dx=e.clientX-lastX}});
cv.addEventListener("pointerup",e=>{if(!dragging)return;e.preventDefault();dragging=false;let tx=e.clientX-sx,ty=e.clientY-sy;if(!moved&&Math.abs(tx)<15&&Math.abs(ty)<15)rotate();else if(ty>55&&Math.abs(ty)>Math.abs(tx)*1.15)hard()});
cv.addEventListener("pointercancel",()=>dragging=false);


// iPhone Safari: keep all game gestures inside the game instead of the browser.
const gameUI=document.querySelector(".app");
["touchstart","touchmove","touchend","touchcancel"].forEach(type=>{
  gameUI.addEventListener(type,e=>{ e.preventDefault(); },{passive:false});
});
["dblclick","contextmenu","selectstart","dragstart"].forEach(type=>{
  gameUI.addEventListener(type,e=>e.preventDefault());
});
let lastTapGuard=0;
gameUI.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTapGuard<400)e.preventDefault();
  lastTapGuard=now;
},{passive:false});

document.addEventListener("contextmenu",e=>e.preventDefault());
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));

document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.body.addEventListener("pointerdown",()=>{try{ac()}catch(e){}},{once:true});

reset();requestAnimationFrame(loop);
</script></body></html>
